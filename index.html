<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraGuard - Mobile Safety Prototype</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    
    /* Device Frame */
    .phone {
      width: 380px; height: 750px; background: #000; border-radius: 40px;
      border: 8px solid #334155; position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    }
    
    /* Top Bar */
    .header { padding: 20px 20px 10px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; }
    .status-badge { background: #065f46; color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 11px; }

    /* Map Mockup */
    .map-box {
      margin: 10px 20px; height: 180px; background: #1e293b; border-radius: 16px;
      position: relative; overflow: hidden; border: 1px solid #334155;
    }
    .grid-lines {
      width: 100%; height: 100%;
      background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px);
      background-size: 30px 30px; opacity: 0.3;
    }
    
    /* Blinking Beacon */
    .beacon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 18px; height: 18px; background: #ef4444; border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 1);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
      100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Red Alert Button */
    .emergency-section { text-align: center; margin-bottom: 25px; }
    .red-btn {
      width: 170px; height: 170px; border-radius: 50%;
      background: radial-gradient(circle, #ff2a2a 0%, #b91c1c 100%);
      border: 5px solid rgba(255, 255, 255, 0.3);
      color: white; font-weight: 900; font-size: 18px; cursor: pointer;
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.6);
      transition: transform 0.1s;
      outline: none;
    }
    .red-btn:active { transform: scale(0.94); }

    /* Alert Active Overlay */
    .alert-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #7f1d1d; display: none; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 20px; z-index: 10;
    }
    .strobe { animation: strobeEffect 0.3s infinite alternate; }
    @keyframes strobeEffect {
      from { background: #991b1b; }
      to { background: #1e1b4b; }
    }
    .progress-bar-container {
      width: 80%; height: 10px; background: #334155; border-radius: 5px; margin: 15px 0; overflow: hidden;
    }
    .progress-bar { width: 100%; height: 100%; background: #fbbf24; transition: width 4s linear; }

    /* Fast Action Bar */
    .action-row { display: flex; justify-content: space-around; margin: 0 15px; }
    .action-btn {
      background: #1e293b; border: 1px solid #475569; color: white;
      padding: 10px 14px; border-radius: 12px; font-size: 11px; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="phone">
  <!-- Top bar -->
  <div class="header">
    <span>09:42</span>
    <span class="status-badge">● GUARD ACTIVE</span>
    <span>88% 🔋</span>
  </div>

  <!-- Map Display -->
  <div class="map-box">
    <div class="grid-lines"></div>
    <div class="beacon"></div>
    <div style="position:absolute; bottom: 8px; left: 10px; font-size: 11px; color: #94a3b8;">
      📍 Riverside Trail • Beacon Live
    </div>
  </div>

  <!-- Auxiliary Features -->
  <div class="action-row">
    <button class="action-btn" onclick="alert('Simulating incoming call from Dad...')">📞 Fake Call</button>
    <button class="action-btn" onclick="alert('5-Minute Dead-man timer armed.')">⏱️ Walk Timer</button>
    <button class="action-btn" onclick="alert('Silent SOS broadcasted quietly.')">🤫 Silent SOS</button>
  </div>

  <!-- Emergency Section -->
  <div class="emergency-section">
    <p style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;">TAP FOR 4-SEC SIREN & PHOTO BURST</p>
    <button class="red-btn" id="panicButton" onclick="triggerAlert()">
      EMERGENCY<br>ALERT
    </button>
  </div>

  <!-- Alert Screen Modal -->
  <div class="alert-overlay strobe" id="alertOverlay">
    <h1 style="font-size: 32px; margin: 0;">🚨 SIREN ACTIVE</h1>
    <p style="font-size: 13px; margin: 5px 0;">Audible Deterrent Running (120dB)</p>
    
    <div class="progress-bar-container">
      <div class="progress-bar" id="pBar"></div>
    </div>
    
    <div id="statusLog" style="font-size: 14px; line-height: 1.6; text-align: left; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; width: 85%;">
      <div>🔊 Siren Countdown: <b id="timerText">4s</b></div>
      <div id="camStatus">⏳ Priming dual camera burst...</div>
      <div id="dispatchStatus">⏳ Locking GPS & Beacon...</div>
    </div>

    <button onclick="resetAlert()" style="margin-top: 20px; background: white; color: black; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer;">
      Cancel / Disarm
    </button>
  </div>
</div>

<script>
  function triggerAlert() {
    const overlay = document.getElementById('alertOverlay');
    const pBar = document.getElementById('pBar');
    const timerText = document.getElementById('timerText');
    const camStatus = document.getElementById('camStatus');
    const dispatchStatus = document.getElementById('dispatchStatus');

    overlay.style.display = 'flex';
    pBar.style.width = '0%';

    let timeLeft = 4;
    const interval = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        timerText.innerText = timeLeft + 's';
      } else {
        clearInterval(interval);
        timerText.innerText = '0s (SIREN ENDED)';
        
        // 4.0s - Siren ends, trigger dual photo capture
        camStatus.innerHTML = "📸 <b>Adversary Photos Captured (5 Frames Front/Back)</b>";
        
        // <2.0s Dispatch transmission
        setTimeout(() => {
          dispatchStatus.innerHTML = "⚡ <b>Dispatched to 3 Guardians in 1.2s</b><br>🛰️ Live Blinking Beacon Broadcasting";
        }, 800);
      }
    }, 1000);
  }

  function resetAlert() {
    document.getElementById('alertOverlay').style.display = 'none';
    document.getElementById('pBar').style.width = '100%';
    document.getElementById('timerText').innerText = '4s';
    document.getElementById('camStatus').innerText = '⏳ Priming dual camera burst...';
    document.getElementById('dispatchStatus').innerText = '⏳ Locking GPS & Beacon...';
  }
</script>

</body>
</html>
